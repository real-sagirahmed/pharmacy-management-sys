name: Deploy to MonsterASP.NET

on:
  push:
    branches:
      # ARCHITECTURAL INTENT: Production FTP deploys to /wwwroot/ must only trigger on main.
      # Do NOT re-add develop here until a dedicated staging FTP server/directory is configured.
      - main     # → Production (MonsterASP main site)
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Angular Frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps
          rm -rf ../wwwroot
          npm run build
          cd ..
          if [ -d "wwwroot/browser" ]; then
            cp -r wwwroot/browser/* wwwroot/
            rm -rf wwwroot/browser
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Inject Secrets into appsettings.json
        run: |
          cat > appsettings.json << 'APPSETTINGS_EOF'
          {
            "ConnectionStrings": {
              "DefaultConnection": "${{ secrets.DB_CONNECTION }}"
            },
            "Jwt": {
              "Key": "${{ secrets.JWT_KEY }}",
              "Issuer": "PharmacyApi",
              "Audience": "PharmacyFrontend"
            },
            "Logging": {
              "LogLevel": {
                "Default": "Information",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "AllowedHosts": "*",
            "Cors": {
              "AllowedOrigins": [
                "https://pharmacymsys.runasp.net",
                "http://localhost:4200"
              ]
            },
            "SmtpSettings": {
              "Host": "smtp.gmail.com",
              "Port": 587,
              "EnableSsl": true,
              "Username": "${{ secrets.SMTP_USERNAME }}",
              "Password": "${{ secrets.SMTP_PASSWORD }}",
              "SenderEmail": "${{ secrets.SMTP_USERNAME }}",
              "SenderName": "teams7"
            },
            "SystemAdminSeed": {
              "FullName": "System Administrator",
              "UserName": "SystemAdmin",
              "Email": "sysadmin@s7pharmacy.com",
              "Password": "${{ secrets.ADMIN_PASSWORD }}"
            }
          }
          APPSETTINGS_EOF

      - name: Publish .NET Backend
        run: |
          rm -rf ./publish
          dotnet publish -c Release -o ./publish
          rm -rf ./publish/wwwroot
          cp -r wwwroot ./publish/wwwroot
          rm -f ./publish/app_offline.htm
          echo "Final publish directory structure verification:"
          ls -R ./publish

      - name: Install FTPS Client (lftp)
        run: sudo apt-get update && sudo apt-get install -y lftp

      # ARCHITECTURAL INTENT: Upload app_offline.htm BEFORE FTP-Deploy-Action starts (and exclude it
      # from FTP-Deploy-Action sync) so IIS releases DLL/EXE locks beforehand and .ftp-deploy-sync-state.json
      # never goes out of sync. Cleanup must use FTPS (ssl-force + ssl-protect-data) without invalid `|| true`.
      - name: Take Site Offline (Upload app_offline.htm)
        id: take_offline
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ./offline
          echo "<html><body style='font-family:sans-serif;text-align:center;padding:50px;'><h1>System Update in Progress</h1><p>Update Time: $(date -u)</p></body></html>" > ./offline/app_offline.htm
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:reconnect-interval-base 3;
            set cmd:fail-exit yes;
            open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\";
            cd /wwwroot || cd wwwroot || pwd;
            put ./offline/app_offline.htm -o app_offline.htm;
            quit
          "
          echo "Waiting 3 seconds for IIS to unload app and release file locks..."
          sleep 3

      - name: Deploy to FTP
        id: deploy_ftp
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/
          protocol: ftps
          port: 21
          exclude: |
            **/app_offline.htm
            app_offline.htm

      - name: Cleanup app_offline.htm (Bring Site Online)
        if: always() && (steps.take_offline.outcome == 'success' || steps.take_offline.outcome == 'failure')
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Attempting to delete app_offline.htm using secure FTPS..."
          REMOTE_FILES=$(lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:reconnect-interval-base 3;
            set cmd:fail-exit yes;
            open --env-password -u \"$FTP_USERNAME\" \"$FTP_SERVER\";
            cd /wwwroot || cd wwwroot || pwd;
            rm -f app_offline.htm || echo 'app_offline.htm already absent';
            cls -1
          " | tr -d '\r')
          if printf '%s\n' "$REMOTE_FILES" | grep -Eiq '(^|/)app_offline\.htm$'; then
            echo "ERROR: app_offline.htm still exists on the server after cleanup!"
            exit 1
          fi
          echo "Verified: app_offline.htm removed and site is back online."

