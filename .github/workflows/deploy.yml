name: Deploy to MonsterASP.NET

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Angular Frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps
          rm -rf ../wwwroot
          npm run build
          cd ..
          if [ -d "wwwroot/browser" ]; then
            cp -r wwwroot/browser/* wwwroot/
            rm -rf wwwroot/browser
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Inject Secrets into appsettings.json
        run: |
          cat > appsettings.json << 'APPSETTINGS_EOF'
          {
            "ConnectionStrings": {
              "DefaultConnection": "${{ secrets.DB_CONNECTION }}"
            },
            "Jwt": {
              "Key": "${{ secrets.JWT_KEY }}",
              "Issuer": "PharmacyApi",
              "Audience": "PharmacyFrontend"
            },
            "Logging": {
              "LogLevel": {
                "Default": "Information",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "AllowedHosts": "*",
            "Cors": {
              "AllowedOrigins": [
                "http://pharmacymsys.runasp.net",
                "http://localhost:4200"
              ]
            },
            "SmtpSettings": {
              "Host": "smtp.gmail.com",
              "Port": 587,
              "EnableSsl": true,
              "Username": "${{ secrets.SMTP_USERNAME }}",
              "Password": "${{ secrets.SMTP_PASSWORD }}",
              "SenderEmail": "${{ secrets.SMTP_USERNAME }}",
              "SenderName": "teams7"
            },
            "SystemAdminSeed": {
              "FullName": "System Administrator",
              "UserName": "SystemAdmin",
              "Email": "sysadmin@s7pharmacy.com",
              "Password": "${{ secrets.ADMIN_PASSWORD }}"
            }
          }
          APPSETTINGS_EOF

      - name: Publish .NET Backend
        run: |
          rm -rf ./publish
          dotnet publish -c Release -o ./publish
          rm -rf ./publish/wwwroot
          cp -r wwwroot ./publish/wwwroot
          echo "<html><body style='font-family:sans-serif;text-align:center;padding:50px;'><h1>System Update in Progress</h1><p>Update Time: $(date)</p></body></html>" > ./publish/app_offline.htm
          echo "Final publish directory structure verification:"
          ls -R ./publish

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/
          protocol: ftps
          port: 21

      - name: Cleanup app_offline.htm (Bring Site Online)
        if: always()
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          echo "Attempting to delete app_offline.htm using lftp..."
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            cd /wwwroot || cd wwwroot || true;
            rm -f app_offline.htm;
            quit
          " ${{ secrets.FTP_SERVER }}

